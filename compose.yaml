name: meditwin

services:
  meditwin-backend:
    image: meditwin/backend-dev:latest
    container_name: meditwin-backend-dev
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: sh -c "uv sync --frozen --no-dev && uv run fastapi dev app/main.py --host 0.0.0.0 --port 8000"
    environment:
      ENVIRONMENT: dev
      DEBUG: "true"
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      WATCHFILES_FORCE_POLLING: "true"
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - meditwin_backend_venv:/app/.venv
      - meditwin_backend_uv_cache:/root/.cache/uv
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    init: true
    stdin_open: true
    tty: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  meditwin-frontend:
    image: meditwin/frontend-dev:latest
    container_name: meditwin-frontend-dev
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: sh -c "bun install --frozen-lockfile && bun dev --hostname 0.0.0.0 --port 3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - meditwin_frontend_node_modules:/app/node_modules
      - meditwin_frontend_bun_cache:/root/.bun/install/cache
    depends_on:
      meditwin-backend:
        condition: service_healthy
    init: true
    stdin_open: true
    tty: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  meditwin_backend_venv:
    name: meditwin_backend_venv
  meditwin_backend_uv_cache:
    name: meditwin_backend_uv_cache
  meditwin_frontend_node_modules:
    name: meditwin_frontend_node_modules
  meditwin_frontend_bun_cache:
    name: meditwin_frontend_bun_cache
